name: Verify Extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run verification
        run: |
          npm ci --ignore-scripts
          npm run check
          git diff --exit-code -- firefox_extension
